name: Recru_It

on: # [push]
  workflow_dispatch:
  schedule:
    - cron: '25 18 * * *'	# 매일 03:25 (UTC+9) [UTC기준 매일 18:25]
    # - cron: '35 17 * * *'	# 매일 02:35 (UTC+9) [UTC기준 매일 17:35]
    # 시간 02:00 ~ 04:00 조정하며 새벽에 조금씩만 가져오자
    
    # - cron: '28 17 * * 1,3,5'
    # ⬆️ 화, 목, 토 02:28 (UTC+9) [UTC기준 월, 수, 금 17:28]
    
    # - cron: '55 23 31 2 6'
    # ⬆️ 실행되지 않아야 하지만 ➡️ GitHub에서 2월중 토요일(6) 실행됨 / 마지막 * 면 계속 실행됨

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
    - name: Upgrade pip
      run: python -m pip install --upgrade pip
    - name: apt-get update
      run: sudo apt-get update
    - name: Defendency
      run: |
        sudo apt-get install python3 python3-dev python3-pip libxml2-dev libxslt1-dev zlib1g-dev libffi-dev libssl-dev
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2
    - name: Requirements
      run: |
        hostname -I
        pwd
        ls -al
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python3 -m pip install "pyOpenSSL==24.2.1" "cryptography==43.0.3"
    - name: Execution
      run: |
        pwd
        ls -al

        if [ -f recru_result.json ]; then rm -f recru_result.json; fi
        scrapy crawl recru_it

        python3 - <<'PY'
        import json
        import sys

        with open("recru_result.json", encoding="utf-8") as result:
            items = json.load(result)

        if not isinstance(items, list):
            print("Spider result is not a JSON list; failing before commit.")
            sys.exit(1)

        if len(items) < 50:
            print(f"Spider produced only {len(items)} items; failing before commit.")
            sys.exit(1)

        print(f"Spider produced {len(items)} items.")
        PY

        cp -fp recru_result.json ../jobInfo.json
        cp -fp recru_result.json ../config.json
      working-directory: ./recru_it
    
    - name: Commit files
      run: |
        git config --local user.email "hjpyooo@gmail.com"
        git config --local user.name "Jay"
        if git diff --quiet -- jobInfo.json config.json recru_it/recru_result.json; then
          echo "Nothing to commit, working tree clean"
        else
          git add jobInfo.json config.json recru_it/recru_result.json
          git commit -m "Recru_It"
        fi
        git pull --rebase
    
    - name: Push changes
      run: git push
